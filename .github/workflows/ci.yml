name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - run: composer install --no-progress

      - run: composer lint

      - run: composer cs
        if: matrix.php == '8.5'

      - run: composer phpstan
        if: matrix.php == '8.5'

      - run: composer test
